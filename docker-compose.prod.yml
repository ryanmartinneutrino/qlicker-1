services:
  mongo:
    image: mongo:7
    command: ["mongod", "--port", "${MONGO_PORT:?Set MONGO_PORT in .env}"]
    expose:
      - "${MONGO_PORT:?Set MONGO_PORT in .env}"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  server:
    build: ./server
    deploy:
      replicas: 3
    environment:
      - PORT=${API_PORT:?Set API_PORT in .env}
      - MONGO_URI=mongodb://mongo:${MONGO_PORT:?Set MONGO_PORT in .env}/qlicker
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ROOT_URL=${ROOT_URL}
      - MAIL_URL=${MAIL_URL:-}
      - NODE_ENV=production
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:?Set APP_PORT in .env}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - client
    restart: unless-stopped

  client:
    build: ./client
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
