services:
  # MongoDB replica set (required for Change Streams)
  mongo1:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${QCLICKER_MONGO_PORT:-27018}:27017"
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    depends_on:
      mongo1:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongo1:27017 --quiet --eval
      "try {
        const status = rs.status()
        if (status.ok === 1) { quit(0) }
      } catch (e) {
        const init = rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo1:27017' }] })
        if (init.ok !== 1 && init.codeName !== 'AlreadyInitialized') {
          printjson(init)
          quit(1)
        }
      }
      quit(0)"

  # New Express + Socket.IO backend
  server:
    build:
      context: .
      dockerfile: Dockerfile.new
      target: server
    environment:
      - NODE_ENV=production
      - COOKIE_SECURE=false
      - DISABLE_CSRF=true
      - PORT=3001
      - MONGO_URL=mongodb://mongo1:27017/qlicker?replicaSet=rs0
      - ROOT_URL=${QCLICKER_ROOT_URL:-http://localhost:3200}
      - SESSION_SECRET=${SESSION_SECRET:-change-me}
      - QCLICKER_AUTH_RATE_LIMIT_MAX=${QCLICKER_AUTH_RATE_LIMIT_MAX:-2000}
    ports:
      - "${QCLICKER_SERVER_PORT:-3211}:3001"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # React 18 + Vite frontend (served as static files by nginx in production)
  client:
    build:
      context: .
      dockerfile: Dockerfile.new
      target: client-serve
    ports:
      - "${QCLICKER_CLIENT_PORT:-3200}:80"
    depends_on:
      - server
    restart: unless-stopped

  # Optional one-shot legacy backup restore into qlicker DB.
  # Usage: docker compose --profile legacy-restore run --rm legacy-restore
  legacy-restore:
    image: mongo:7
    profiles: ["legacy-restore"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      - QCLICKER_LEGACY_BACKUP_NAMESPACE=${QCLICKER_LEGACY_BACKUP_NAMESPACE:-qlickerdb}
      - QCLICKER_LEGACY_TARGET_DB=${QCLICKER_LEGACY_TARGET_DB:-qlicker}
    volumes:
      - ${QCLICKER_LEGACY_BACKUP_DIR:-./legacydb/backup_2023-09-14_05-03-01}:/legacydb:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      test -d /legacydb &&
      mongosh --host mongo1:27017 --quiet --eval
      "db.getSiblingDB('$${QCLICKER_LEGACY_TARGET_DB}').dropDatabase()" &&
      mongorestore --host mongo1:27017 --drop
      --nsInclude "$${QCLICKER_LEGACY_BACKUP_NAMESPACE}.*"
      --nsFrom "$${QCLICKER_LEGACY_BACKUP_NAMESPACE}.*"
      --nsTo "$${QCLICKER_LEGACY_TARGET_DB}.*"
      /legacydb

volumes:
  mongo1_data:
