# =============================================================================
# Qlicker — Production Docker Compose
# =============================================================================
# Usage:
#   cp .env.example .env   # then edit .env
#   docker compose up -d
#
# This file is SELF-CONTAINED. It pulls pre-built images from a registry.
# No source checkout is needed beyond this production_setup/ directory.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Not exposed to host; only reachable within the Docker network.
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
      - ./backups:/backups
    # Optimize for production: WiredTiger cache = 1 GB (adjust for your RAM)
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis — required for multi-instance WebSocket pub/sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    # Persistence: AOF + RDB for crash recovery
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Qlicker API server (Fastify)
  # ---------------------------------------------------------------------------
  server:
    image: ${SERVER_IMAGE:-qlicker/qlicker-server:latest}
    restart: unless-stopped
    deploy:
      replicas: ${SERVER_REPLICAS:-2}
    environment:
      - PORT=${API_PORT:-3001}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/qlicker}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      - ROOT_URL=${ROOT_URL:-https://localhost}
      - MAIL_URL=${MAIL_URL:-}
      - NODE_ENV=production
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - AWS_FORCE_PATH_STYLE=${AWS_FORCE_PATH_STYLE:-}
      - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME:-}
      - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY:-}
      - AZURE_CONTAINER_NAME=${AZURE_CONTAINER_NAME:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Qlicker Client (React SPA served by internal Nginx)
  # ---------------------------------------------------------------------------
  client:
    image: ${CLIENT_IMAGE:-qlicker/qlicker-client:latest}
    restart: unless-stopped
    environment:
      - API_PORT=${API_PORT:-3001}
    depends_on:
      - server

  # ---------------------------------------------------------------------------
  # Nginx — TLS termination & reverse proxy (the only service exposed to host)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_PATH:-./certs/fullchain.pem}:/etc/nginx/ssl/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./certs/privkey.pem}:/etc/nginx/ssl/privkey.pem:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - server
      - client
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Certbot — automatic Let's Encrypt certificate renewal (optional)
  # ---------------------------------------------------------------------------
  # Uncomment this service if you want automated certificate management.
  # On first run, use setup.sh --init-certs to obtain the initial certificate.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renew certificates every 12 hours (certbot is a no-op if not due)
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done'
    depends_on:
      - nginx

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  uploads:
    driver: local
  certbot-conf:
    driver: local
  certbot-webroot:
    driver: local
